# AWS Amplify Hosting build spec for this TanStack Start app.
# Configure the app in the Amplify console as "Web Compute" / SSR.
version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm install -g bun
            - bun install --frozen-lockfile
        build:
          commands:
            - AMPLIFY=1 bunx vite build --config vite.config.amplify.ts
            - node scripts/amplify-package.mjs
      artifacts:
        baseDirectory: .amplify-hosting
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
